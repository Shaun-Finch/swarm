name: domain check (one-off)
on: { push: { branches: [dns-check] } }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          for i in $(seq 1 60); do
            t=$(curl -sL --max-time 15 http://swarm-ai.cloud | grep -o "<title>[^<]*</title>" || true)
            echo "try $i: $t"
            case "$t" in *Swarm*) break;; esac
            sleep 15
          done
          echo "== http";  curl -sI --max-time 20 http://swarm-ai.cloud | head -4
          echo "== https"; curl -sI --max-time 20 https://swarm-ai.cloud 2>&1 | head -4 || echo "https not ready"
          echo "== www";   curl -sIL --max-time 20 http://www.swarm-ai.cloud | grep -iE "^(HTTP|location)" || true
